pipeline:
  name: javascript-client
  identifier: javascriptclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: javascript-client
        build: <+input>
  stages:
    - stage:
        name: Check-Test-Build-Upload
        identifier: Check_Test_Build_Upload
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            override: true
            paths: []
          buildIntelligence:
            enabled: false
          execution:
            steps:
              - step:
                  type: Background
                  name: Redis
                  identifier: Redis
                  spec:
                    connectorRef: dockerhub
                    image: redis:7
                    shell: Sh
              - step:
                  type: Run
                  name: Check Redis
                  identifier: Check_Redis
                  spec:
                    connectorRef: dockerhub
                    image: redis:7
                    shell: Sh
                    command: redis-cli -h localhost ping
              - step:
                  type: Run
                  name: npm ci
                  identifier: npm_ci
                  spec:
                    connectorRef: dockerhub
                    image: node:lts
                    shell: Bash
                    command: npm ci
                    envVariables:
                      PUPPETEER_SKIP_DOWNLOAD: "true"
              - step:
                  type: Run
                  name: npm ts tests
                  identifier: npm_ts_tests
                  spec:
                    connectorRef: dockerhub
                    image: node:lts
                    shell: Bash
                    command: npm run test-ts-decls
              - step:
                  type: Run
                  name: npm run check
                  identifier: npm_run_check
                  spec:
                    connectorRef: dockerhub
                    image: node:lts
                    shell: Bash
                    command: npm run check
              - step:
                  type: Run
                  name: npm test-browser
                  identifier: npm_test_browser
                  spec:
                    connectorRef: dockerhub
                    image: cypress/browsers:latest
                    shell: Bash
                    command: |-
                      CHROME_BIN=$(which google-chrome-stable || which chromium-browser || which chromium)
                      export CHROME_BIN
                      npm run test-browser
              - step:
                  type: Run
                  name: npm test-node
                  identifier: npm_test_node
                  spec:
                    connectorRef: dockerhub
                    image: node:lts
                    shell: Bash
                    command: npm run test-node
              - step:
                  type: Run
                  name: npm run build
                  identifier: npm_run_build
                  spec:
                    connectorRef: dockerhub
                    image: node:lts
                    shell: Bash
                    command: BUILD_BRANCH=<+codebase.branch> npm run build
              - parallel:
                  - step:
                      type: Run
                      name: upload dev assets to CDN
                      identifier: upload_dev_assets_to_CDN
                      spec:
                        connectorRef: dockerhub
                        image: amazon/aws-cli:2.31.5
                        shell: Bash
                        command: aws s3 sync ./umd s3://split-public-stage/sdk --acl public-read --follow-symlinks --cache-control max-age=31536000,public
                        envVariables:
                          AWS_DEFAULT_REGION: us-east-1
                      when:
                        stageStatus: Success
                        condition: <+trigger.event> == "PUSH" && <+trigger.branch> == "development"
                  - step:
                      type: Run
                      name: upload prod assets to CDN
                      identifier: upload_prod_assets_to_CDN
                      spec:
                        connectorRef: dockerhub
                        image: amazon/aws-cli:2.31.5
                        shell: Bash
                        command: aws s3 sync ./umd s3://split-public/sdk --acl public-read --follow-symlinks --cache-control max-age=31536000,public
                        envVariables:
                          AWS_DEFAULT_REGION: us-east-1
                      when:
                        stageStatus: Success
                        condition: <+trigger.event> == "PUSH" && <+trigger.branch> == "main"
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: "<+codebase.branch == \"main\" ? \"use1prod1cd\" : \"use1stage1cd\">"
              namespace: harness-delegate
              serviceAccountName: "<+codebase.branch == \"main\" ? \"use1-prod-1-public-assets\" : \"use1-stage-1-public-assets\">"
              automountServiceAccountToken: false
              nodeSelector: {}
              os: Linux
